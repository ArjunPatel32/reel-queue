# Shared setup for every workflow: Python deps, plus ffmpeg/tesseract when
# the job edits video.
name: Set up reel-queue
description: Install Python and the tools the scripts need

inputs:
  media-tools:
    description: Also install ffmpeg and tesseract (needed for downloading/editing)
    default: "false"

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v6
      with:
        python-version: "3.12"
        cache: pip

    # curl-cffi lets yt-dlp impersonate a browser, which logged-out Instagram
    # downloads require. Dependencies come from stable releases; yt-dlp itself
    # is then swapped for the nightly (--no-deps, so no beta dependencies),
    # because Instagram breaks the extractor often and fixes land there first.
    - shell: bash
      run: |
        pip install -r requirements.txt "yt-dlp[default,curl-cffi]"
        pip install -U --pre --no-deps yt-dlp
        yt-dlp --version
        python -c "import curl_cffi; print('curl_cffi', curl_cffi.__version__)"

    - if: inputs.media-tools == 'true'
      shell: bash
      run: |
        missing=""
        command -v ffmpeg >/dev/null || missing="$missing ffmpeg"
        command -v tesseract >/dev/null || missing="$missing tesseract-ocr"
        if [ -n "$missing" ]; then
          # Rebuilding the man-page index after an install can stall for
          # 10+ minutes on GitHub's Ubuntu runners; we never read man pages.
          sudo rm -f /var/lib/man-db/auto-update
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends $missing
        fi
        ffmpeg -version | head -1
        tesseract --version | head -1
