# Retries any reel that hasn't downloaded yet. Instagram blocks datacenter
# IPs unpredictably, so this is the safety net that makes ingest reliable.
name: Retry downloads

on:
  schedule:
    - cron: "17 */4 * * *"
  workflow_dispatch:

concurrency:
  group: queue-write
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  retry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Download pending reels
        run: python scripts/download.py
        env:
          IG_COOKIES: ${{ secrets.IG_COOKIES }}
          GH_TOKEN: ${{ github.token }}

      - name: Save queue state
        if: always()
        run: python scripts/commit.py "retry: download pending reels"
