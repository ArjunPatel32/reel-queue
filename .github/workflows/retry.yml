# Retries any reel that hasn't downloaded yet. Instagram blocks datacenter
# IPs unpredictably, so this is the safety net that makes ingest reliable.
name: Retry downloads

on:
  schedule:
    - cron: "17 */4 * * *"
  workflow_dispatch:

concurrency:
  group: retry
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  retry:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/setup
        with:
          media-tools: "true"

      - name: Download pending reels
        run: python scripts/download.py
        env:
          IG_COOKIES: ${{ secrets.IG_COOKIES }}
          GH_TOKEN: ${{ github.token }}

      - name: Save queue state
        if: always()
        run: |
          python scripts/commit.py "retry - download pending reels"
