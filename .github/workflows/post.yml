# The poster. Runs hourly; post.py plans each day once, then every run posts
# whatever falls due before the next one. Hourly because GitHub's cron runs
# hours late - see the top of scripts/post.py.
name: Post reels

on:
  schedule:
    - cron: "41 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Walk through without posting or changing anything
        type: boolean
        default: false
      post_now:
        description: Post the oldest ready reel right now
        type: boolean
        default: false

concurrency:
  group: post
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      # The branch tip, not the commit from when this run was triggered -
      # a run that waited in a queue would otherwise act on stale state.
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}

      - uses: ./.github/actions/setup

      - name: Post what's due
        run: python scripts/post.py
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
          POST_NOW: ${{ inputs.post_now && '1' || '' }}
          GH_TOKEN: ${{ github.token }}
